version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autoparts-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=autoparts_user
      - POSTGRES_PASSWORD=autoparts_secure_pass123
      - POSTGRES_DB=autoparts_db
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoparts_user -d autoparts_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoparts-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Persistent App Data Directory
      - ./data:/app/data
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://autoparts_user:autoparts_secure_pass123@postgres:5432/autoparts_db
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

