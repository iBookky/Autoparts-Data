<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Background rounded square with shadow -->
    <rect width="60" height="60" rx="14" fill="url(#brandGrad)" filter="url(#glow)"/>
    
    <!-- Geometric Automotive / Parts Cross-Ref Glyph -->
    <path d="M30 14 L46 23.5 L46 42.5 L30 52 L14 42.5 L14 23.5 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="30" cy="33" r="6" fill="#FFFFFF"/>
    <path d="M30 14 L30 27 M30 39 L30 52 M14 23.5 L25 29.5 M35 36.5 L46 42.5 M46 23.5 L35 29.5 M25 36.5 L14 42.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Typography -->
  <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Prompt', 'Segoe UI', sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">
    AutoParts <tspan fill="url(#accentGrad)">Cross-Ref</tspan>
  </text>
  <text x="86" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Prompt', 'Segoe UI', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="1.2">
    B2B AUTOMOTIVE INTELLIGENCE
  </text>
</svg>
