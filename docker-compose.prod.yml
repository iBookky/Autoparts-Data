version: '3.8'

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: autoparts-caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 Support
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    networks:
      - autoparts-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoparts-backend-app
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # Persistent SQLite Database Directory
      - ./data:/app/data
    environment:
      - PORT=8000
      - DB_PATH=/app/data/autoparts.db
      - ENVIRONMENT=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - autoparts-net
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"

networks:
  autoparts-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
